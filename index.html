<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Омут</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="ui">
    <div id="label"></div>
    <div id="toast"></div>
    <div id="subs"><div class="who"></div><div class="text"></div></div>
    <div id="choices"></div>
    <div id="inv" class="empty"><div id="inv-bag" title="Чемодан"></div><div id="inv-items"></div></div>
    <button id="menu-btn" aria-label="Меню">≡</button>
    <div id="frags"><div class="h">Видение</div><div class="cards"></div><div class="slots"></div><div class="hint"></div></div>
    <div id="card"><div class="t"></div><div class="s"></div></div>
    <div id="title">
      <div class="logo">ОМУТ</div>
      <div class="tag">в тихом омуте…</div>
      <div class="buttons">
        <button data-act="new">Новая игра</button>
        <button data-act="continue">Продолжить</button>
        <button data-act="ch2">Глава вторая</button>
      </div>
      <div class="hint">Лучше в наушниках · ЛКМ — действие · ПКМ — осмотреть · долгое касание на телефоне</div>
    </div>
    <div id="menu">
      <div class="box">
        <div class="h">Пауза</div>
        <button data-act="resume">Продолжить</button>
        <button data-act="sound">Звук: вкл</button>
        <button data-act="restart">Начать заново</button>
      </div>
    </div>
  </div>
</div>
<script src="src/util.js"></script>
<script src="src/paint.js"></script>
<script src="src/actors.js"></script>
<script src="src/figure.js"></script>
<script src="src/audio.js"></script>
<script src="src/engine.js"></script>
<script src="src/scenes/busstop.js"></script>
<script src="src/scenes/street.js"></script>
<script src="src/scenes/lobby.js"></script>
<script src="src/scenes/lobby2.js"></script>
<script src="src/scenes/room.js"></script>
<script src="src/scenes/pier.js"></script>
<script src="src/scenes/square.js"></script>
<script src="src/scenes/library.js"></script>
<script src="src/scenes/archive.js"></script>
<script src="src/story.js"></script>
<script src="src/story2.js"></script>
<script src="src/main.js"></script>
</body>
</html>
