# Сборка Android-приложения «Омут» для RuStore.
# Всегда: тестовый APK (debug) — поставить на телефон и проверить.
# Если в секретах репозитория есть ключ подписи — ещё подписанные релизные APK и AAB для загрузки в RuStore.
# Секреты: OMUT_KEYSTORE_BASE64, OMUT_KEYSTORE_PASSWORD, OMUT_KEY_ALIAS, OMUT_KEY_PASSWORD.
name: Android

on:
  push:
    paths: ['src/**', 'index.html', 'assets/**', 'app/**', 'tools/build.js', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Веб-сборка и синхронизация с Android
        working-directory: app
        run: |
          npm ci
          npm run sync

      - name: Тестовый APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Ключ подписи
        id: key
        env:
          KS: ${{ secrets.OMUT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/omut-release.jks"
            echo "OMUT_KEYSTORE=$RUNNER_TEMP/omut-release.jks" >> "$GITHUB_ENV"
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "Секрет OMUT_KEYSTORE_BASE64 не задан — релиз не подписываем, будет только тестовый APK."
          fi

      - name: Релиз для RuStore (APK + AAB)
        if: steps.key.outputs.ok == '1'
        working-directory: app/android
        env:
          OMUT_KEYSTORE_PASSWORD: ${{ secrets.OMUT_KEYSTORE_PASSWORD }}
          OMUT_KEY_ALIAS: ${{ secrets.OMUT_KEY_ALIAS }}
          OMUT_KEY_PASSWORD: ${{ secrets.OMUT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Переименовать файлы
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk out/omut-test.apk
          if [ -f app/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp app/android/app/build/outputs/apk/release/app-release.apk out/omut-rustore.apk
            cp app/android/app/build/outputs/bundle/release/app-release.aab out/omut-rustore.aab
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: omut-android
          path: out/
