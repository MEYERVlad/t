# Сборка Android-приложения «Омут» для RuStore.
# Всегда: тестовый APK (debug) — поставить на телефон и проверить.
# Если в секретах репозитория есть ключ подписи — ещё подписанные релизные APK и AAB для загрузки в RuStore.
# Секреты: OMUT_KEYSTORE_BASE64, OMUT_KEYSTORE_PASSWORD, OMUT_KEY_ALIAS, OMUT_KEY_PASSWORD.
name: Android

on:
  push:
    paths: ['src/**', 'index.html', 'assets/**', 'app/**', 'tools/build.js', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Веб-сборка и синхронизация с Android
        working-directory: app
        run: |
          npm ci
          npm run sync

      - name: Тестовый APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Ключ подписи
        id: key
        env:
          KS: ${{ secrets.OMUT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/omut-release.jks"
            echo "OMUT_KEYSTORE=$RUNNER_TEMP/omut-release.jks" >> "$GITHUB_ENV"
            echo "real=1" >> "$GITHUB_OUTPUT"
          else
            # Ключа нет — проверяем, что релизная сборка с подписью вообще собирается, на временном ключе.
            # Эти файлы не выкладываются: для RuStore нужен ваш постоянный ключ.
            echo "Секрет OMUT_KEYSTORE_BASE64 не задан — релиз собирается для проверки на временном ключе и не выкладывается."
            keytool -genkeypair -keystore "$RUNNER_TEMP/tmp.jks" -alias tmp -keyalg RSA -keysize 2048 -validity 1 \
              -storepass tmppass -keypass tmppass -dname "CN=tmp" >/dev/null 2>&1
            echo "OMUT_KEYSTORE=$RUNNER_TEMP/tmp.jks" >> "$GITHUB_ENV"
            echo "TMP_PW=tmppass" >> "$GITHUB_ENV"
            echo "TMP_ALIAS=tmp" >> "$GITHUB_ENV"
          fi

      - name: Релиз (APK + AAB)
        working-directory: app/android
        env:
          OMUT_KEYSTORE_PASSWORD: ${{ secrets.OMUT_KEYSTORE_PASSWORD || env.TMP_PW }}
          OMUT_KEY_ALIAS: ${{ secrets.OMUT_KEY_ALIAS || env.TMP_ALIAS }}
          OMUT_KEY_PASSWORD: ${{ secrets.OMUT_KEY_PASSWORD || env.TMP_PW }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Переименовать файлы
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk out/omut-test.apk
          if [ "${{ steps.key.outputs.real }}" = "1" ]; then
            cp app/android/app/build/outputs/apk/release/app-release.apk out/omut-rustore.apk
            cp app/android/app/build/outputs/bundle/release/app-release.aab out/omut-rustore.aab
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: omut-android
          path: out/
