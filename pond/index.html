<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1d3b33">
<title>Заводь</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d3b33;color:#f4ecd8;
  font-family:Georgia,'PT Serif','Times New Roman',serif;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(14,36,40,.58);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.13);box-shadow:0 4px 18px rgba(0,0,0,.18)}
.pearl{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:-.06em;
  background:radial-gradient(circle at 35% 30%,#fff 0 18%,#f3ebff 30%,#cfc3e6 65%,#9a8fb8 100%);
  box-shadow:0 0 6px rgba(255,245,255,.6)}
#hud{position:fixed;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;
  justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.pill{border-radius:999px;padding:7px 14px;font-size:17px;white-space:nowrap}
#goals{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 46px);
  display:flex;flex-direction:column;gap:6px;align-items:center;width:min(70vw,420px);z-index:4}
.goal{border-radius:14px;padding:6px 12px;font-size:13.5px;text-align:center;cursor:pointer;width:100%;box-sizing:border-box;transition:background .3s}
.goal .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:4px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:#e9d9a8;width:0;transition:width .4s}
.goal.done{background:rgba(160,120,40,.75);animation:pulse 1.6s infinite}
.goal.hid{display:none}
#sgoal img{width:22px;height:22px;vertical-align:-6px;margin-right:5px}
#evb{font-size:12.5px;padding:3px 10px;cursor:default;width:auto;opacity:.9}
@keyframes pulse{50%{transform:scale(1.035)}}
#dlg{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,140%);width:min(94vw,560px);box-sizing:border-box;
  border-radius:20px;padding:14px 16px 12px 108px;min-height:118px;z-index:15;transition:transform .35s cubic-bezier(.2,.8,.2,1);cursor:pointer;background:rgba(14,34,38,.92)}
#dlg.on{transform:translate(-50%,0)}
#dlg .pt{position:absolute;left:8px;top:-30px;width:94px;height:94px}
#dlg .pt img{width:100%;height:100%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
#dlg .who{color:#e9d9a8;font-size:14px;letter-spacing:.4px;margin-bottom:4px}
#dlg .txt{font-size:16.5px;line-height:1.42;min-height:46px}
#dlg .ch{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#dlg .more{text-align:right;opacity:.5;font-size:13px;animation:breathe 2s infinite}
#dlg .fx canvas{width:170px;height:70px;display:block}
#dlg.note{background:rgba(238,226,198,.97);color:#3a2e22;padding-left:20px;font-style:italic}
#dlg.note .who{color:#8a6a44;font-style:normal}
#tabs{transition:opacity .3s}
body.talking #tabs,body.talking #goals{opacity:0;pointer-events:none}
#tip{position:fixed;left:50%;transform:translate(-50%,16px);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 80px);display:flex;align-items:center;gap:10px;
  padding:6px 16px 6px 6px;border-radius:999px;width:max-content;max-width:min(92vw,480px);box-sizing:border-box;opacity:0;pointer-events:none;transition:.4s;font-size:14.5px;line-height:1.3;z-index:6}
#tip.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#tip img{width:46px;height:46px;flex:none}
#rvbar{position:fixed;left:10px;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 50px);display:none;justify-content:space-between;align-items:center;z-index:4}
#rvbar button{color:#f4ecd8;font:inherit;font-size:15px;cursor:pointer}
#rvbar .bait{font-size:15px}
#rvhint{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:none;font-size:13.5px;opacity:.8;text-align:center;width:90vw;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none}
body.river #tabs,body.river #goals,body.river #count{display:none}
body.river #rvbar{display:flex}
body.river #rvhint{display:block}
#tabs button{width:56px;height:56px}
.note-item{background:rgba(238,226,198,.1);border-radius:12px;padding:10px 12px;margin:8px 0;font-style:italic;line-height:1.45;font-size:14.5px}
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));
  display:flex;gap:8px;z-index:5}
#tabs button{width:60px;height:60px;border-radius:50%;color:#f4ecd8;font:inherit;font-size:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
#tabs button b{font-size:22px;font-weight:normal;line-height:1}
#tabs button{position:relative}#tabs button.has::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:#f1c862;
  top:4px;right:4px;box-shadow:0 0 6px #f1c862}
#tabs button.hid{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:74vh;overflow:auto;
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:10;
  background:rgba(16,36,40,.94);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  box-sizing:border-box;touch-action:pan-y;border:1px solid rgba(255,255,255,.1)}
.sheet.open{transform:none}
.sheet h2{margin:0 0 4px;font-weight:normal;font-size:22px;letter-spacing:.5px}
.sheet .sub{opacity:.7;font-size:14px;margin-bottom:12px;line-height:1.35}
.sheet .x{position:absolute;right:12px;top:10px;background:none;border:0;color:#f4ecd8;font-size:26px;opacity:.6;cursor:pointer}
.btn{background:#e9d9a8;color:#1d3030;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:rgba(255,255,255,.1);color:#f4ecd8}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.row .t{flex:1;min-width:0}
.row .t div:first-child{font-size:16px}
.row .t div+div{font-size:13px;opacity:.65;margin-top:2px}
.row .ic{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cell{background:rgba(255,255,255,.06);border-radius:12px;padding:6px;text-align:center;font-size:11.5px;line-height:1.2;
  border:2px solid transparent;cursor:pointer;min-height:84px}
.cell canvas{width:84px;height:46px;display:block;margin:0 auto 3px}
.cell.sel{border-color:#e9d9a8;background:rgba(233,217,168,.14)}
.cell.unk{opacity:.45}
.cell .s{opacity:.6;font-size:10.5px}
.grp{margin:14px 0 6px;font-size:13px;opacity:.7;letter-spacing:1px;text-transform:uppercase}
#card canvas.big{width:100%;max-width:300px;height:130px;display:block;margin:0 auto}
.stars{color:#f1c862;letter-spacing:2px}
.meter{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:#9fd3c7}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0}
.kv span:nth-child(odd){opacity:.6}
.genes{font-size:13px;line-height:1.6;background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px;margin:8px 0}
.genes i{opacity:.55;font-style:normal}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);pointer-events:none;z-index:20;
  text-align:center;font-size:20px;opacity:0;transition:opacity .5s;text-shadow:0 2px 12px rgba(0,0,0,.6);max-width:86vw}
#toast small{display:block;font-size:14px;opacity:.8;margin-top:4px}
#toast.on{opacity:1}
#hint{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 84px);transform:translateX(-50%);
  font-size:15px;opacity:.85;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.7);transition:opacity 1s;text-align:center;width:90vw}
#veil{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .3s}
#veil.on{opacity:1;pointer-events:auto}
#intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(20,50,50,.5),rgba(10,25,28,.92));transition:opacity 1.2s;text-align:center;cursor:pointer}
#intro .logo{font-size:56px;letter-spacing:6px}
#intro .tag{opacity:.75;margin-top:6px;font-style:italic}
#intro .go{margin-top:34px;opacity:.8;font-size:15px;animation:breathe 3s infinite}
@keyframes breathe{50%{opacity:.35}}
#intro.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="pill glass" id="pearls"><span class="pearl"></span> <b>0</b></div>
  <div class="pill glass" id="count">🐟 0/6</div>
</div>
<div id="goals"><div id="sgoal" class="goal glass hid"><div class="tt"></div><div class="bar"><i></i></div></div><div id="task" class="goal glass hid"><div class="tt"></div><div class="bar"><i></i></div></div><div id="evb" class="goal glass hid"></div></div>
<div id="rvbar"><button class="glass pill back">← К пруду</button><div class="glass pill bait"></div></div>
<div id="rvhint">Коснитесь воды — закинуть. Поплавок нырнул — касайтесь сразу</div>
<div id="tabs">
  <button class="glass" data-tab="breed"><b>🥚</b>Нерест</button>
  <button class="glass" data-tab="atlas"><b>📖</b>Атлас</button>
  <button class="glass" data-tab="garden"><b>🌿</b>Сад</button>
  <button class="glass hid" data-tab="river"><b>🎣</b>Река</button>
  <button class="glass" data-tab="menu"><b>☰</b>Ещё</button>
</div>
<div id="veil"></div>
<div class="sheet" id="sheet"><button class="x">×</button><div class="in"></div></div>
<div id="toast"></div>
<div id="dlg" class="glass"><div class="pt"></div><div class="who"></div><div class="fx"></div><div class="txt"></div><div class="ch"></div></div>
<div id="tip" class="glass"><img alt=""><span></span></div>
<div id="intro"><div class="logo">ЗАВОДЬ</div><div class="tag">тихий пруд, где живут карпы</div><div class="go">коснитесь, чтобы войти</div></div>
<script>
'use strict';
/* ================= утилиты ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d};
const now=()=>Date.now();
const fmt=n=>n>=10000?(n/1000).toFixed(n>=100000?0:1)+'к':String(Math.floor(n));
const P='<span class="pearl"></span>';

/* ================= генетика ================= */
// у каждой рыбы по два аллеля каждого гена; сильный аллель перекрывает слабый
const GENES={B:'WYOK',P:'ncbs',C:'ugkr',M:'+m',V:'+v',G:'+g',A:'+a'};
const DOM={B:'KOYW',P:'sbcn',C:'rkgu'};
const AL={
  B:{W:'белый',Y:'сливочный',O:'рыжий',K:'чёрный'},
  P:{n:'без узора',c:'шапочка',b:'полосы',s:'пятна'},
  C:{r:'алый',k:'чёрный',g:'золотой',u:'синий'},
  M:{'+':'матовый',m:'блеск'},V:{'+':'короткие',v:'вуаль'},G:{'+':'плотный',g:'призрак'},A:{'+':'—',a:'сияние'}
};
const GN={B:'Окрас',P:'Узор',C:'Цвет узора',M:'Чешуя',V:'Плавники',G:'Тело',A:'Свет'};
const expr=(k,p)=>DOM[k].indexOf(p[0])<=DOM[k].indexOf(p[1])?p[0]:p[1];
function pheno(g){return{b:expr('B',g.B),p:expr('P',g.P),c:expr('C',g.C),m:g.M==='mm',v:g.V==='vv',gh:g.G==='gg',a:g.A.includes('a')}}
function breed(a,b,mut){
  const g={};
  for(const k in GENES){
    let x=a[k][Math.random()<.5?0:1], y=b[k][Math.random()<.5?0:1];
    if(k==='A'){ if(Math.random()<auroraChance())x='a'; }
    else if(Math.random()<mut*(evOn('star')?2:1)){ if(Math.random()<.5)x=pick(GENES[k]);else y=pick(GENES[k]); }
    g[k]=Math.random()<.5?x+y:y+x;
  }
  return g;
}
const keyOf=ph=>ph.p==='n'?ph.b+'n':ph.b+ph.p+ph.c;
const ATLAS=[];
for(const b of 'WYOK'){ATLAS.push(b+'n');for(const p of 'csb')for(const c of 'rkgu')ATLAS.push(b+p+c)}
const BASEN={W:'Снежный',Y:'Сливочный',O:'Рыжий',K:'Угольный'};
const PATN={s:['в','пятнах',{r:'алых',k:'чёрных',g:'золотых',u:'синих'}],
  b:['с','полосами',{r:'алыми',k:'чёрными',g:'золотыми',u:'синими'}],
  c:['с','шапочкой',{r:'алой',k:'чёрной',g:'золотой',u:'синей'}]};
const SPECIAL={Wcr:'Журавль',Wsk:'Сорока',Wsr:'Земляничка',Kbg:'Тигр',Ksu:'Ночное небо',Ksg:'Звездопад',
  On:'Апельсин',Wn:'Снежок',Kn:'Уголёк',Yn:'Сливка',Ybu:'Река',Obk:'Шмель',Wbu:'Иней',Ycr:'Вишенка',
  Osu:'Сойка',Kcr:'Огонёк',Ocg:'Солнышко',Wbr:'Леденец',Ysk:'Перепёлка',Kbr:'Уголь и жар'};
function nameOfKey(k){
  if(SPECIAL[k])return SPECIAL[k];
  if(k[1]==='n')return BASEN[k[0]]+' карп';
  const [pre,noun,adj]=PATN[k[1]];return BASEN[k[0]]+' '+pre+' '+adj[k[2]]+' '+noun;
}
function descOfKey(k){
  if(k[1]==='n')return AL.B[k[0]]+', без узора';
  const [pre,noun,adj]=PATN[k[1]];return AL.B[k[0]]+', '+pre+' '+adj[k[2]]+' '+noun;
}
const MODS=[{k:'m',n:'Блестящий',d:'Чешуя ловит свет. Скрытый ген, нужен от обоих родителей.'},
  {k:'v',n:'Вуалевый',d:'Длинные струящиеся плавники. Скрытый ген.'},
  {k:'gh',n:'Призрачный',d:'Полупрозрачное тело. Скрытый ген.'},
  {k:'a',n:'Сияющий',d:'Переливается всеми цветами. Появляется очень редко, сам по себе.'}];
function modsText(ph){const m=[];if(ph.m)m.push('блестящий');if(ph.v)m.push('вуалевый');if(ph.gh)m.push('призрачный');if(ph.a)m.push('сияющий');return m.join(', ')}
function rarity(ph){
  let r=0;if(ph.b==='W')r+=2;else if(ph.b==='Y')r+=1;
  if(ph.p==='n')r+=2;else if(ph.p!=='s')r+=1;
  if(ph.p!=='n'){if(ph.c==='u')r+=2;else if(ph.c==='g')r+=1}
  if(ph.m)r+=2;if(ph.v)r+=2;if(ph.gh)r+=3;if(ph.a)r+=5;return r;
}
const stars=ph=>Math.min(5,1+Math.floor(rarity(ph)/3));
const pearlVal=ph=>1+Math.floor(rarity(ph)/2);
const releaseVal=ph=>6+rarity(ph)*7;

/* ================= цвета ================= */
const BASEC={W:'#f3efe6',Y:'#f0d9a2',O:'#ef8a2e',K:'#2a2c31'};
const FINC={W:'rgba(250,246,238,',Y:'rgba(246,226,176,',O:'rgba(250,170,96,',K:'rgba(70,74,84,'};
const PATC={r:'#d43a2c',k:'#18191d',g:'#e3ad35',u:'#3d6db3'};
const patColor=(ph)=>ph.b==='K'&&ph.c==='k'?'#465773':ph.b==='O'&&ph.c==='r'?'#b8221b':ph.b==='Y'&&ph.c==='g'?'#cf8f1c':PATC[ph.c];

/* ================= экран и пруд ================= */
const cv=$('#c'), g=cv.getContext('2d');
let W=0,H=0,DPR=1,S=1;
const pond={cx:0,cy:0,rx:0,ry:0,pts:[]};
const SE=3.2;
let bg=null, caust=null, caustPat=null;
function pondQ(x,y){return Math.pow(Math.abs((x-pond.cx)/pond.rx),SE)+Math.pow(Math.abs((y-pond.cy)/pond.ry),SE)}
const PU=(u,v)=>({x:pond.cx+u*pond.rx,y:pond.cy+v*pond.ry});
function pondPath(c){c.beginPath();const p=pond.pts;c.moveTo(p[0].x,p[0].y);
  for(let i=1;i<=p.length;i++){const a=p[i%p.length],b=p[(i+1)%p.length];c.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2)}c.closePath()}

function resize(){
  const ow=pond.rx?{cx:pond.cx,cy:pond.cy,rx:pond.rx,ry:pond.ry}:null;
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  pond.cx=W/2;pond.cy=H*0.5;pond.rx=Math.min(W*0.45,H*0.85);pond.ry=Math.min(H*0.37,W*0.75);
  S=clamp(Math.sqrt(pond.rx*pond.ry)/250,.72,1.6);
  pond.pts=[];
  for(let i=0;i<120;i++){const a=i/120*Math.PI*2,c=Math.cos(a),s=Math.sin(a);
    const w=1+.018*Math.sin(a*3+.7)+.012*Math.sin(a*7+2);
    pond.pts.push({x:pond.cx+pond.rx*w*Math.sign(c)*Math.pow(Math.abs(c),2/SE),y:pond.cy+pond.ry*w*Math.sign(s)*Math.pow(Math.abs(s),2/SE)})}
  if(ow&&state)for(const f of state.fish){
    const u=(f.x-ow.cx)/ow.rx,v=(f.y-ow.cy)/ow.ry,p=PU(u,v);f.x=p.x;f.y=p.y;f.sp=null}
  buildBg();buildCaustics();if(scene==='river')buildRiverBg();
}
function season(){const m=new Date().getMonth();return m>=2&&m<=4?'spring':m>=5&&m<=7?'summer':m>=8&&m<=10?'autumn':'winter'}
const GRASS={spring:['#7aa858','#8fbf62','#5f8f45'],summer:['#5d9643','#6faa4c','#4a7d36'],autumn:['#8d9446','#a59a48','#6f7a3a'],winter:['#c7d1d4','#dde5e6','#aab8bd']};
function buildBg(){
  bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;
  const c=bg.getContext('2d');c.scale(DPR,DPR);const sea=season(),gr=GRASS[sea],r=mulberry(7);
  c.fillStyle=gr[0];c.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){const x=r()*W,y=r()*H,rr=40+r()*120;const gg=c.createRadialGradient(x,y,0,x,y,rr);
    gg.addColorStop(0,r()<.5?gr[1]+'88':gr[2]+'66');gg.addColorStop(1,gr[0]+'00');c.fillStyle=gg;c.fillRect(x-rr,y-rr,rr*2,rr*2)}
  const n=Math.floor(W*H/90);c.lineCap='round';
  for(let i=0;i<n;i++){const x=r()*W,y=r()*H,l=(3+r()*6)*S;c.strokeStyle=r()<.5?gr[1]:gr[2];c.globalAlpha=.25+r()*.35;c.lineWidth=1;
    c.beginPath();c.moveTo(x,y);c.lineTo(x+(r()-.5)*3,y-l);c.stroke()}
  if(sea==='autumn'){for(let i=0;i<n/14;i++){const x=r()*W,y=r()*H;c.globalAlpha=.5+r()*.4;c.fillStyle=pick(['#c8642a','#d9952f','#b5452a','#e0b23f']);
    c.beginPath();c.ellipse(x,y,2.5*S,1.6*S,r()*3,0,7);c.fill()}}

  else if(f.cur&&f.cur.t>0&&!f.leave){f.cur.t-=dt;f.tx=f.cur.x;f.ty=f.cur.y;speedT=40*S;turn=3;f.mode='wander';if(Math.hypot(f.tx-f.x,f.ty-f.y)<14*S)f.cur.t=0}
  else if(!f.leave){f.mt-=dt;
    if(f.mt<=0||Math.hypot(f.tx-f.x,f.ty-f.y)<20*S){
      const restP=pk==='shy'?.45:pk==='fast'?.08:pk==='sleepy'&&LN>.5?.75:.22;
      if(Math.random()<restP){f.mode='rest';f.mt=rnd(3,8)*(pk==='sleepy'&&LN>.5?2:1)}else{f.mode='wander';f.mt=rnd(5,14);f.spd=rnd(.5,1.15)*(pk==='fast'?1.4:1);
        let tries=0,q;if(pk==='shy'&&state.deco.lily&&Math.random()<.6){const l=pick(LILY);q=PU(l.u,l.v)}else do{q=PU(rnd(-.82,.82),rnd(-.82,.82));tries++}while(tries<8&&pondQ(q.x,q.y)>.62);f.tx=q.x;f.ty=q.y}}}
  let dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
  // берег
  const la=L*.9,lq=pondQ(f.x+Math.cos(f.a)*la,f.y+Math.sin(f.a)*la);
  if(lq>.66&&!f.leave){const k=(lq-.66)*5;dx+=(pond.cx-f.x)/pond.rx*k;dy+=(pond.cy-f.y)/pond.ry*k}
  for(const o of obs){const ox=f.x-o.x,oy=f.y-o.y,od=Math.hypot(ox,oy);if(od<o.r+L*.6){const k=(o.r+L*.6-od)/(o.r)*1.5;dx+=ox/od*k;dy+=oy/od*k}}
  for(const o of state.fish){if(o===f)continue;const ox=f.x-o.x,oy=f.y-o.y,od=ox*ox+oy*oy,rr=(L+fishLen(o))*.35;if(od<rr*rr&&od>0.01){const q=Math.sqrt(od);dx+=ox/q*.6*(1-q/rr);dy+=oy/q*.6*(1-q/rr)}}
  const want=Math.atan2(dy,dx);const da=angDiff(f.a,want);f.a+=clamp(da,-turn*dt,turn*dt);
  if(Math.abs(da)>1.6&&!food)speedT*=.5;
  f.v=lerp(f.v,speedT,1-Math.exp(-dt*1.6));
  f.x+=Math.cos(f.a)*f.v*dt;f.y+=Math.sin(f.a)*f.v*dt;
  if(!f.leave&&pondQ(f.x,f.y)>.93){f.x=lerp(f.x,pond.cx,.02);f.y=lerp(f.y,pond.cy,.02)}
  f.ph2+=dt*(2.2+f.v/S*.09);
  const sp=f.sp;sp[0].x=f.x;sp[0].y=f.y;
  for(let i=1;i<N;i++){let ex=sp[i].x-sp[i-1].x,ey=sp[i].y-sp[i-1].y,ed=Math.hypot(ex,ey)||1;sp[i].x=sp[i-1].x+ex/ed*seg;sp[i].y=sp[i-1].y+ey/ed*seg}
  // жизнь
  const fm=UPG.food.val[state.up.food]*(1+uyut()*.02);
  if(f.hu<.85){f.gr=Math.min(1,f.gr+dt/360*fm*(f.gr>=.7?.45:1)*(f.hu<.4?1.25:1))}
  f.hu=Math.min(1,f.hu+dt/200);
  if(isAdult(f)&&!f.leave){f.pt+=dt/24*(1+uyut()*.04)*(rain?1.5:1)*(f.hu<.85?1:.35)*(pk==='gentle'?1.25:1);
    if(f.pt>=1){f.pt-=1;dropPearl(f.sp[3].x,f.sp[3].y,pearlVal(p))}}
}
function renderSpine(f){
  const L=fishLen(f),sp=f.sp,N=sp.length,amp=L*.2*(.22+Math.min(1,f.v/(50*S))*.7),out=[];
  for(let i=0;i<N;i++){const t=i/(N-1),a=sp[Math.max(0,i-1)],b=sp[Math.min(N-1,i+1)];let dx=a.x-b.x,dy=a.y-b.y;const d=Math.hypot(dx,dy)||1;
    const o=Math.sin(f.ph2-t*3.4)*amp*Math.pow(t,1.5);out.push({x:sp[i].x-dy/d*o,y:sp[i].y+dx/d*o})}
  return out;
}
function eat(f,q){q.dead=1;f.hu=Math.max(0,f.hu-.3);f.gr=Math.min(1,f.gr+.006*UPG.food.val[state.up.food]);
  ripples.push({x:q.x,y:q.y,t:0,m:12*S});state.st.fed++;taskProg('feed',1);if(Math.random()<.4)snd.blip()}
function feed(x,y,auto){
  const n=auto?6:3;for(let i=0;i<n;i++){const a=rnd(6.28),r=rnd(auto?30:12)*S;pellets.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,t:0,c:pick(['#c99a5b','#b0763f','#dab070'])})}

function hatch(e){

  const p=ph(f),k=keyOf(p),nk=[];

const HAVE=[{k:'b',v:'W',t:'белую рыбу'},{k:'b',v:'Y',t:'сливочную рыбу'},{k:'b',v:'K',t:'чёрную рыбу'},{k:'p',v:'b',t:'рыбу с полосами'},
 {k:'p',v:'c',t:'рыбу с шапочкой'},{k:'p',v:'n',t:'рыбу совсем без узора'},{k:'c',v:'u',t:'рыбу с синим узором'},{k:'c',v:'g',t:'рыбу с золотым узором'},
 {k:'m',v:true,t:'блестящую рыбу'},{k:'v',v:true,t:'вуалевую рыбу'},{k:'p',v:'s',t:'пятнистую рыбу'},{k:'b',v:'O',t:'рыжую рыбу'}];
function hasTrait(h){return state.fish.some(f=>{const p=ph(f);return p[h.k]===h.v&&(h.k!=='c'||p.p!=='n')})}
function newTask(){
  const l=state.taskLvl,types=['feed','pearls','hatch','have','have','adults','newform','big'];
  let t,tries=0;
  do{t=pick(types);tries++}while(tries<20&&((t==='big'&&l<2)||(t==='newform'&&Object.keys(state.atlas).length>=ATLAS.length)||(t==='adults'&&cap()<8)));
  const T={type:t,p:0};
  if(t==='feed'){T.n=12+l*4;T.txt=`Покормить рыб ${T.n} раз`;T.rw=15+l*5}
  if(t==='pearls'){T.n=30+l*15;T.txt=`Собрать ${T.n} жемчужин`;T.rw=12+l*5}
  if(t==='hatch'){T.n=2+Math.floor(l/2);T.txt=`Вырастить мальков из икры: ${T.n}`;T.rw=20+l*6}
  if(t==='newform'){T.n=1;T.txt='Вывести новую породу для атласа';T.rw=30+l*8}
  if(t==='big'){T.n=1;T.txt='Вырастить рыбу-великана (полный размер)';T.rw=40+l*8}
  if(t==='adults'){T.n=Math.min(cap()-1,4+Math.floor(l/2));T.txt=`Чтобы в пруду жили ${T.n} взрослых рыб`;T.rw=25+l*6}
  if(t==='have'){const opts=HAVE.filter(h=>!hasTrait(h));const h=opts.length?pick(opts):pick(HAVE);T.h=h;T.n=1;T.txt='Вывести '+h.t;T.rw=40+l*10}
  state.task=T;
}
function taskProg(type,n){const t=state.task;if(t&&t.type===type&&t.p<t.n){t.p=Math.min(t.n,t.p+n)}}
function taskCheck(){const t=state.task;if(!t)return;
  if(t.type==='have')t.p=hasTrait(t.h)?1:0;
  if(t.type==='adults')t.p=Math.min(t.n,state.fish.filter(isAdult).length);
  if(t.type==='big')t.p=state.fish.some(f=>f.gr>=1)?1:0;}
function claimTask(){const t=state.task;if(talking||!t||t.p<t.n)return;state.pearls+=t.rw;texts.push({x:W/2,y:110,t:0,s:'+'+t.rw});snd.discover();
  state.taskLvl++;newTask();save()}

const snd=(()=>{
  let C=null,master,wet,amb,rainG,nextNote=0;

    master=C.createGain();master.gain.value=state.opt.snd?1:0;master.connect(C.destination);
    const conv=C.createConvolver(),len=C.sampleRate*3,ir=C.createBuffer(2,len,C.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
    conv.buffer=ir;wet=C.createGain();wet.gain.value=.5;wet.connect(conv);conv.connect(master);
    const nb=C.createBuffer(1,C.sampleRate*3,C.sampleRate),nd=nb.getChannelData(0);let last=0;
    for(let i=0;i<nd.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;nd[i]=last*3.5}
    const src=C.createBufferSource();src.buffer=nb;src.loop=true;const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;
    amb=C.createGain();amb.gain.value=.16;src.connect(lp);lp.connect(amb);amb.connect(master);src.start();
    const wb=C.createBuffer(1,C.sampleRate*2,C.sampleRate),wd=wb.getChannelData(0);for(let i=0;i<wd.length;i++)wd[i]=Math.random()*2-1;
    const rs=C.createBufferSource();rs.buffer=wb;rs.loop=true;const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=.4;
    rainG=C.createGain();rainG.gain.value=0;rs.connect(bp);bp.connect(rainG);rainG.connect(master);rs.start();
  }
  function tone(f,t,dur,vol,type='sine',dry=.5){if(!C)return;const o=C.createOscillator(),gn=C.createGain();o.type=type;o.frequency.value=f;
    gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.015);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(gn);const dg=C.createGain();dg.gain.value=dry;gn.connect(dg);dg.connect(master);gn.connect(wet);o.start(t);o.stop(t+dur+.05)}
  function bell(f,t,vol){tone(f,t,2.6,vol);tone(f*2.76,t,1.2,vol*.25);tone(f*5.4,t,.5,vol*.08)}
  const DAY=[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99,880],NIGHT=[220,261.63,293.66,329.63,392,440,523.25,587.33];
  return{init,
    resume(){if(C&&C.state==='suspended')C.resume()},
    set(on){if(master)master.gain.setTargetAtTime(on?1:0,C.currentTime,.1)},
    plop(){if(!C)return;const t=C.currentTime,o=C.createOscillator(),gn=C.createGain();o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(160,t+.12);
      gn.gain.setValueAtTime(.18,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(gn);gn.connect(master);gn.connect(wet);o.start(t);o.stop(t+.2)},
    blip(){if(!C)return;const t=C.currentTime,o=C.createOscillator(),gn=C.createGain();o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(900,t+.06);
      gn.gain.setValueAtTime(.05,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+.1)},
    pearl(){if(!C)return;const t=C.currentTime;bell(1318.5,t,.07);bell(1975.5,t+.07,.05)},
    knock(){if(!C)return;const t=C.currentTime;[0,.18].forEach(d=>{const o=C.createOscillator(),gn=C.createGain();o.frequency.setValueAtTime(140,t+d);o.frequency.exponentialRampToValueAtTime(70,t+d+.1);
      gn.gain.setValueAtTime(.2,t+d);gn.gain.exponentialRampToValueAtTime(.0001,t+d+.14);o.connect(gn);gn.connect(master);o.start(t+d);o.stop(t+d+.2)});bell(880,t+.45,.03)},
    cast(){if(!C)return;const t=C.currentTime,o=C.createOscillator(),gn=C.createGain();o.type='triangle';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(300,t+.35);
      gn.gain.setValueAtTime(.04,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+.45)},
    reel(){if(!C)return;const t=C.currentTime;for(let i=0;i<8;i++){const o=C.createOscillator(),gn=C.createGain();o.type='square';o.frequency.value=1800;gn.gain.setValueAtTime(.015,t+i*.07);gn.gain.exponentialRampToValueAtTime(.0001,t+i*.07+.02);o.connect(gn);gn.connect(master);o.start(t+i*.07);o.stop(t+i*.07+.03)}},
    hatch(){if(!C)return;const t=C.currentTime;[587.33,739.99,880].forEach((f,i)=>bell(f,t+i*.12,.06))},
    discover(){if(!C)return;const t=C.currentTime;[587.33,739.99,880,1174.66,1479.98].forEach((f,i)=>bell(f,t+i*.14,.07))},

  };
})();

/* ================= время суток ================= */
function light(){
  const m=state.opt.time;if(m==='day')return{n:0,w:0};if(m==='night')return{n:1,w:0};
  const d=new Date(),h=d.getHours()+d.getMinutes()/60;
  const n=h<5?1:h<7?1-(h-5)/2:h<18.5?0:h<21?(h-18.5)/2.5:1;
  const w=Math.max(0,1-Math.abs(h-6.5)/1.4)+Math.max(0,1-Math.abs(h-19.3)/1.6);
  return{n,w:Math.min(1,w)};
}

    g.globalAlpha=f.leave?clamp(1-f.leave.t/3,0,1):1;drawFish(g,sp.map(p=>({x:p.x+off,y:p.y+off*1.2})),fishLen(f),ph(f),look(f),tm,'rgba(5,18,20,.28)')}

    const gOn=state.story.end||state.story.step>4||(state.story.step===4&&state.story.phase==='goal');
    if(gOn&&!talking&&now()>state.nextGuest&&state.guests.length<2){spawnGuest(false);state.nextGuest=now()+rnd(3,7)*60000}}
  if(scene==='river')riverStep(dt);

  if(Math.random()<rate*dt&&floaters.length<14){const p=PU(rnd(-.85,.85),rnd(-.85,.85));if(pondQ(p.x,p.y)<.8){
    const leaf=sea==='autumn';floaters.push({x:p.x,y:p.y,a:rnd(6.28),va:rnd(-.1,.1),vx:rnd(-3,3)*S,vy:rnd(-2,2)*S,t:0,al:0,k:leaf?'leaf':'petal',s:(leaf?rnd(6,9):rnd(2.5,4))*S,
      c:leaf?pick(['#c8642a','#d9952f','#b5452a','#e0b23f']):sea==='spring'?pick(['#f9d4e2','#fff','#f4b8cf']):'#f4f1e6'});ripples.push({x:p.x,y:p.y,t:.3,m:10*S})}}

  snd.tick(L.n>.5,!!state.deco.chime);
}

  for(const o of state.guests){if(o.out)continue;const p=guestPos(o);if(Math.hypot(p.x-x,p.y-y+8*S)<28*S){talkGuest(o);return}}
  for(const q of pearlsOn){if(Math.hypot(q.x-x,q.y-y)<26*S){collect(q);state.st.collected++;return}}
  let best=null,bd=1e9;
  for(const f of state.fish){if(!f.sp||f.leave)continue;for(const i of[0,3,6]){const p=f.sp[i],d=Math.hypot(p.x-x,p.y-y);const lim=Math.max(16*S,fishLen(f)*.32);if(d<lim&&d<bd){bd=d;best=f}}}
  if(best){openCard(best);return}

}

function markTabs(){
  const cd=state.nextBreed-now(),adults=state.fish.filter(isAdult).length;
  $('[data-tab=breed]').classList.toggle('has',cd<=0&&adults>=2&&state.fish.length+pendingEggs()<cap()&&state.pearls>=breedCost());
  const cheap=DECOS.some(d=>!state.deco[d.id]&&d.cost<=state.pearls)||Object.keys(UPG).some(k=>{const u=UPG[k],l=state.up[k];return l+1<u.cost.length&&u.cost[l+1]<=state.pearls});
  $('[data-tab=garden]').classList.toggle('has',cheap);

function fishTitle(f){const p=ph(f),m=modsText(p);return nameOfKey(keyOf(p))+(m?' · '+m:'')}
function stage(f){return f.gr<.35?'малёк':f.gr<.7?'подросток':f.gr<1?'взрослая':'великан'}
function age(f){const m=Math.floor((now()-f.born)/60000);return m<60?m+' мин':m<1440?Math.floor(m/60)+' ч':Math.floor(m/1440)+' дн'}
function openCard(f){
  selected=f;const p=ph(f),ins=state.up.insight;
  const genes=ins?Object.keys(GENES).filter(k=>k!=='A'||f.gn.A.includes('a')).map(k=>{const a=f.gn[k][0],b=f.gn[k][1],e=k==='M'||k==='V'||k==='G'||k==='A'?null:expr(k,f.gn[k]);

    const c=sin.querySelector('canvas.big');let t0=T;const draw=()=>{if(sheetKind!=='card')return;thumb(c,f,T);};draw();clearInterval(sheetTimer);sheetTimer=setInterval(draw,60);

      const i=h.querySelector('input'),ok=()=>{const n=i.value.trim();if(n)f.name=n.slice(0,18);save();openCard(f)};
      i.focus();i.select();i.onkeydown=k=>{if(k.key==='Enter')ok()};h.querySelector('button').onclick=k=>{k.stopPropagation();ok()}};
    const rel=sin.querySelector('.rel');let armed=false;

      if(!armed){armed=true;rel.textContent='Точно отпустить? Нажмите ещё раз';rel.style.background='rgba(200,120,80,.35)';return}
      const v=releaseVal(p);state.pearls+=v;state.st.released++;state.relNames.push(f.name);if(state.relNames.length>12)state.relNames.shift();const a=Math.atan2(f.y-pond.cy,f.x-pond.cx);f.leave={t:0,x:pond.cx+Math.cos(a)*pond.rx*1.6,y:pond.cy+Math.sin(a)*pond.ry*1.6};
      texts.push({x:f.x,y:f.y,t:0,s:'+'+v});closeSheet();toast(`${f.name} уплывает в реку`,'Счастливого пути',2600);save()};
  });
}
const breedCost=()=>10+state.fish.length*3;
let pickA=null,pickB=null;
function openBreed(){
  const adults=state.fish.filter(f=>isAdult(f)&&!f.leave);
  if(pickA&&!adults.includes(pickA))pickA=null;if(pickB&&!adults.includes(pickB))pickB=null;
  const lvl=state.up.nest,nE=2+(lvl>0?1:0);
  const ord=state.guests.filter(o=>!o.out).map(o=>`<div>• ${GUESTS.find(g=>g.id===o.gid).name}: ${reqText(o.req)} ${state.fish.some(f=>matchReq(f,o.req))?'✓':''}</div>`).join('');
  if(cap()-state.fish.length-pendingEggs()<=0)dedTip('Пруд-то полон. Отпусти кого в реку или расширь пруд в Саду.');
  openSheet('breed',`<h2>Нерест</h2><div class="sub">Выберите двух взрослых рыб. Мальки возьмут от каждого родителя по половине генов — иногда проявится то, чего не видно у родителей.</div>${ord?`<div class="genes"><b>Заказы гостей</b>${ord}</div>`:''}
    <div class="grid">${adults.map(f=>`<div class="cell ${f===pickA||f===pickB?'sel':''}" data-id="${f.id}"><canvas></canvas>${f.name}<div class="s">${nameOfKey(keyOf(ph(f)))}</div></div>`).join('')||'<div class="sub">Пока нет взрослых рыб — покормите мальков.</div>'}</div>
    <div class="btns" style="justify-content:center;margin-top:16px"><button class="btn go"></button></div><div class="sub" style="text-align:center;margin-top:8px">Икринок: ${nE} · Отдых нерестилища ${UPG.nest.val[lvl]} с</div>`,()=>{
    sin.querySelectorAll('.cell').forEach(el=>{const f=state.fish.find(x=>x.id===el.dataset.id);thumb(el.querySelector('canvas'),f);
      el.onclick=()=>{if(f===pickA)pickA=null;else if(f===pickB)pickB=null;else if(!pickA)pickA=f;else if(!pickB)pickB=f;else{pickA=pickB;pickB=f}openBreed()}});
    const go=sin.querySelector('.go');
    const upd=()=>{if(sheetKind!=='breed')return;const cd=Math.ceil((state.nextBreed-now())/1000),free=cap()-state.fish.length-pendingEggs();
      if(free<=0){go.disabled=true;go.textContent='Пруд полон — расширьте или отпустите рыб'}
      else if(cd>0){go.disabled=true;go.textContent=`Нерестилище отдыхает · ${cd} с`}
      else if(!(pickA&&pickB)){go.disabled=true;go.textContent='Выберите двух рыб'}
      else{go.disabled=state.pearls<breedCost();go.innerHTML=`Нерест · ${P} ${breedCost()}`}};
    upd();clearInterval(sheetTimer);sheetTimer=setInterval(upd,500);
    go.onclick=()=>{if(go.disabled)return;state.pearls-=breedCost();const free=cap()-state.fish.length-pendingEggs();
      const mid={x:(pickA.x+pickB.x)/2,y:(pickA.y+pickB.y)/2};let q=mid;if(pondQ(q.x,q.y)>.6)q=PU(rnd(-.4,.4),rnd(-.4,.4));
      state.eggs.push({x:q.x,y:q.y,t0:now(),dur:40000,n:Math.min(nE,free),a:pickA.gn,b:pickB.gn,mut:lvl>=2?.06:.035});
      state.nextBreed=now()+UPG.nest.val[lvl]*1000;ripples.push({x:q.x,y:q.y,t:0,m:40*S});snd.hatch();
      toast('Икра отложена','Мальки появятся через 40 секунд',2400);pickA=pickB=null;closeSheet();save();markTabs()};
  });
}
function openAtlas(){
  const got=Object.keys(state.atlas).length;
  const fake=k=>({gn:null,seed:k.split('').reduce((a,c)=>a*31+c.charCodeAt(0),7)>>>0,ph:{b:k[0],p:k[1],c:k[2]||'r',m:false,v:false,gh:false,a:false},phg:null,gr:.8});
  const groups=['W','Y','O','K'].map(b=>`<div class="grp">${AL.B[b]}</div><div class="grid">${ATLAS.filter(k=>k[0]===b).map(k=>state.atlas[k]
    ?`<div class="cell" data-k="${k}"><canvas></canvas>${nameOfKey(k)}</div>`:`<div class="cell unk"><canvas></canvas>${SPECIAL[k]?'???':'—'}<div class="s">${state.up.insight?descOfKey(k):''}</div></div>`).join('')}</div>`).join('');

    sin.querySelectorAll('.cell').forEach(el=>{const c=el.querySelector('canvas');const k=el.dataset.k;
      if(k){const f=fake(k);f.ph=pheno({B:k[0]+k[0],P:k[1]+k[1],C:(k[2]||'r')+(k[2]||'r'),M:'++',V:'++',G:'++',A:'++'});f.gn={};f.phg=f.gn;thumb(c,f)}
      else{const f=fake('Wn');f.ph={b:'K',p:'n',c:'r'};f.gn={};f.phg=f.gn;thumb(c,f);const x=c.getContext('2d');x.globalCompositeOperation='source-atop';x.fillStyle='rgba(30,50,55,.9)';x.fillRect(0,0,c.width,c.height)}})});
}

const DED_NAME='Матвей Ильич';
const shadeHex=(hex,a)=>{const n=parseInt(hex.slice(1),16);const f=v=>Math.round(clamp(v*a,0,255));return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`};
let talking=false;
function talk(lines){return new Promise(res=>{
  talking=true;document.body.classList.add('talking');if(sheetKind)closeSheet();$('#tip').classList.remove('on');
  const el=$('#dlg'),pt=el.querySelector('.pt'),who=el.querySelector('.who'),tx=el.querySelector('.txt'),ch=el.querySelector('.ch'),fx=el.querySelector('.fx');
  let i=0,full='',n=0,tmr=0,cur=null;
  const fin=v=>{clearInterval(tmr);el.classList.remove('on');el.onclick=null;setTimeout(()=>{talking=false;document.body.classList.remove('talking')},250);res(v)};
  const showCh=()=>{if(cur.ch){ch.innerHTML=cur.ch.map((c,j)=>`<button class="btn ${j?'ghost':''}" data-j="${j}" ${c.dis?'disabled':''}>${c.t}</button>`).join('');
      ch.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();if(!b.disabled)fin(cur.ch[+b.dataset.j].v)})}
    else ch.innerHTML='<div class="more">дальше ▸</div>'};
  const show=()=>{cur=lines[i];const g=cur.who==='ded'?{id:'ded',name:DED_NAME}:cur.who==='note'?null:GUESTS.find(x=>x.id===cur.who);
    el.classList.toggle('note',cur.who==='note');
    pt.innerHTML=g?`<img src="${IMG[g.id]}" alt="">`:'';who.textContent=g?g.name:(cur.title||'Записка');
    fx.innerHTML='';if(cur.fish){const c=document.createElement('canvas');fx.appendChild(c);thumb(c,cur.fish)}
    ch.innerHTML='';full=cur.t;n=0;tx.textContent='';clearInterval(tmr);
    tmr=setInterval(()=>{n+=2;tx.textContent=full.slice(0,n);if(n>=full.length){clearInterval(tmr);showCh()}},24)};
  el.onclick=()=>{if(n<full.length){n=full.length;tx.textContent=full;clearInterval(tmr);showCh();return}
    if(cur.ch)return;i++;if(i>=lines.length)fin(null);else show()};
  el.classList.add('on');show();
})}
const D=(...ts)=>ts.map(t=>({who:'ded',t}));
let tipT=0,tipCd=0;
function dedTip(t,force){if(talking||scene==='intro')return;if(!force&&now()<tipCd)return;tipCd=now()+40000;
  const el=$('#tip');el.querySelector('img').src=IMG.ded;el.querySelector('span').textContent=t;el.classList.add('on');clearTimeout(tipT);tipT=setTimeout(()=>el.classList.remove('on'),6500)}
$('#tip').addEventListener('click',()=>$('#tip').classList.remove('on'));

  const dt=Math.min(12*3600,(now()-state.last)/1000);if(dt<60)return;
  const fm=UPG.food.val[state.up.food]*(1+uyut()*.02),auto=UPG.auto.val[state.up.auto];let got=0;
  for(const f of state.fish){
    const fedT=auto?dt:Math.max(0,(.85-f.hu)*200);const growT=Math.min(dt,fedT);
    const before=f.gr;f.gr=Math.min(1,f.gr+growT/360*fm*.7);f.hu=auto?.3:Math.min(1,f.hu+dt/200);
    const adultT=before>=.7?growT:Math.max(0,growT-(.7-before)*360/fm/.7);
    const slow=dt-growT;got+=(adultT/24*(1+uyut()*.04)+(before>=.7?slow/24*.35:0))*pearlVal(ph(f))*.5;
  }
  baitTick();
  got=Math.floor(got);state.pearls+=got;state.st.pearls+=got;
  const h=dt>=3600?Math.floor(dt/3600)+' ч':Math.floor(dt/60)+' мин';
  setTimeout(()=>toast(`Вас не было ${h}`,`Рыбы подросли, на дне нашлось ${got} ${P}`,4500),1400);
}
state=load();const fresh=!state;if(!state)state=freshState();
resize();
if(fresh){for(const f of state.fish){const p=PU(rnd(-.5,.5),rnd(-.5,.5));f.x=p.x;f.y=p.y}}
initState();if(!fresh)offline();
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline();state.last=now()}});
addEventListener('pagehide',save);
setInterval(()=>{save();markTabs()},8000);setTimeout(markTabs,500);
scene='intro';
function leaveIntro(){if(scene!=='intro')return;scene='pond';$('#intro').classList.add('off');setTimeout(()=>{if(state.story.phase==='intro'&&!state.story.end)storyIntro()},900)}
$('#intro').addEventListener('pointerdown',()=>{snd.init();snd.resume();leaveIntro()});
if(new URLSearchParams(location.search).has('nointro'))leaveIntro();
let lt=performance.now();
function loop(t){const dt=Math.min(.05,(t-lt)/1000);lt=t;step(dt);if(scene==='river')riverFrame();else frame(dt);hud();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
