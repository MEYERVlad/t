[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Byla v Seti
CompanyName=Byla v Seti Team
ProjectVersion=0.9.0

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
UsePakFile=True
bUseIoStore=True
bCompressed=True
bIncludePrerequisites=True
bIncludeDebugFiles=False
; Данные дела (JSON) кладутся рядом с игрой обычными файлами.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")
; Все локации: игра открывает их по имени, поэтому их нужно перечислить явно.
; В сборку попадают только эти уровни и то, что на них стоит (лишние паки из Fab не попадут).
+MapsToCook=(FilePath="/Game/Maps/L_Office")
+MapsToCook=(FilePath="/Game/Maps/L_IrinaFlat")
+MapsToCook=(FilePath="/Game/Maps/L_LabArchive")
+MapsToCook=(FilePath="/Game/Maps/L_Prichal")
+MapsToCook=(FilePath="/Game/Maps/L_Dacha")
+MapsToCook=(FilePath="/Game/Maps/L_Court")
; Озвучка: звуки ищутся по имени во время игры, поэтому папку нужно включить в сборку целиком.
+DirectoriesToAlwaysCook=(Path="/Game/Voice")
; Музыка: треки ищутся по имени (Theme, Interrogation, Ending, L_<локация>).
+DirectoriesToAlwaysCook=(Path="/Game/Music")
